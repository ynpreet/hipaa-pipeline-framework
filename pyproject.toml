[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hipaa-pipeline-framework"
version = "0.1.0"
description = "Reusable, HIPAA-oriented building blocks for healthcare data pipelines (generic patterns only, synthetic-data demos)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Preet Mehta"}]
keywords = ["healthcare", "data-engineering", "hipaa", "data-quality", "de-identification"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps",
]

[project.urls]
Homepage = "https://github.com/ynpreet/hipaa-pipeline-framework"
Repository = "https://github.com/ynpreet/hipaa-pipeline-framework"

[tool.setuptools]
packages = ["hipaa_pipeline_framework"]
